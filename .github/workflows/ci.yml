name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
      is_pr: ${{ steps.version.outputs.is_pr }}
      can_publish: ${{ steps.check.outputs.can_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Check publishing permissions
        id: check
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "push" ] || [ "$HEAD_REPO" = "$REPO" ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            # Fork PRs get a read-only token, so they are built but not published.
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          args=()
          if [ -n "$PR_NUMBER" ]; then
            git fetch origin "$BASE_REF"
            args+=(--base "origin/$BASE_REF" --pr "$PR_NUMBER")
          fi
          bun scripts/version.mjs "${args[@]}"

  build:
    name: Server build
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Astro server
        run: bun run build

      - name: Package server build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release/bundle
          cp -r dist package.json bun.lock README.md release/bundle/
          tar -czf "release/plazik-server-${VERSION}.tar.gz" -C release/bundle .
          (cd release/bundle && zip -qr "../plazik-server-${VERSION}.zip" .)
          (cd release && sha256sum plazik-server-"${VERSION}".* > checksums.txt)
          ls -lh release/

      - name: Upload server build
        uses: actions/upload-artifact@v4
        with:
          name: plazik-server-${{ needs.version.outputs.version }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/checksums.txt
          if-no-files-found: error
          retention-days: 30

  docker:
    name: Container image
    needs: version
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.version.outputs.can_publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.should_release == 'true' }}
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'push' && needs.version.outputs.should_release == 'true' }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.version.outputs.can_publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: [version, build]
    if: needs.version.outputs.can_publish == 'true' && (github.event_name == 'pull_request' || needs.version.outputs.should_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Download server build
        uses: actions/download-artifact@v4
        with:
          name: plazik-server-${{ needs.version.outputs.version }}
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          IS_PR: ${{ needs.version.outputs.is_pr }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          tag="v${VERSION}"
          assets=(artifacts/checksums.txt artifacts/*.tar.gz artifacts/*.zip)
          if [ "$IS_PR" = "true" ]; then
            # Re-running a PR workflow replaces the previous prerelease assets.
            gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --prerelease \
              --notes "Automated prerelease for PR #${PR_NUMBER} (${GITHUB_SHA:0:7})." \
              "${assets[@]}"
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${assets[@]}"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes \
              "${assets[@]}"
          fi
